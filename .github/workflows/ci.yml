name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    lint:
        name: Lint
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run ESLint
              run: npm run lint

    typecheck:
        name: Type Check
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Type check
              run: npx tsc --noEmit

    test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/checkout@v4
              with:
                  repository: talosprotocol/talos-contracts
                  path: talos-contracts

            - name: Build contracts
              run: |
                  cd talos-contracts/typescript
                  npm ci
                  npm run build

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Run tests
              run: npm test

    build:
        name: Build
        runs-on: ubuntu-latest
        needs: [lint, typecheck, test]
        steps:
            - uses: actions/checkout@v4

            - uses: actions/checkout@v4
              with:
                  repository: talosprotocol/talos-contracts
                  path: talos-contracts

            - name: Build contracts
              run: |
                  cd talos-contracts/typescript
                  npm ci
                  npm run build

            - uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Build
              run: npm run build

    compliance:
        name: Contract Compliance
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Check for deep links
              run: |
                  if rg "file:///|../talos-contracts|../talos/|workspace/study" . --glob '!node_modules' --glob '!.git' 2>/dev/null; then
                    echo "ERROR: Deep links found"
                    exit 1
                  fi

            - name: Check for banned btoa/atob
              run: |
                  if rg "\bbtoa\b|\batob\b" src/ 2>/dev/null; then
                    echo "ERROR: btoa/atob found - use contracts base64url"
                    exit 1
                  fi
